apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-controller
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://jobhuntly-client.vercel.app"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Socket-ID"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "jobhuntly-chat-srv,jobhuntly-company-srv"

spec:
  # ingressClassName: webapprouting.kubernetes.azure.com  for azure
  ingressClassName: nginx  # for digital ocean
  rules:
  - host: url.abhinand.buzz
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-auth-srv
            port:
              number: 2000
      - path: /api/v1/chat
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-chat-srv
            port:
              number: 3000
      - path: /socket.io
        pathType: ImplementationSpecific
        backend:
          service:
            name: jobhuntly-chat-srv
            port:
              number: 3000
      - path: /api/v1/company
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-company-srv
            port:
              number: 4000
      - path: /company-socket/
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-company-srv
            port:
              number: 4000
      - path: /api/v1/job
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-job-srv
            port:
              number: 5000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-notification-srv
            port:
              number: 6000
      - path: /api/v1/user
        pathType: Prefix
        backend:
          service:
            name: jobhuntly-user-srv
            port:
              number: 7000
    # Rule for IP-based access
  - http:
      paths:
        - path: /api/v1/auth
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-auth-srv
              port:
                number: 2000
        - path: /api/v1/chat
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-chat-srv
              port:
                number: 3000
        - path: /api/v1/company
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-company-srv
              port:
                number: 4000
        - path: /api/v1/job
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-job-srv
              port:
                number: 5000
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-notification-srv
              port:
                number: 6000
        - path: /api/v1/user
          pathType: Prefix
          backend:
            service:
              name: jobhuntly-user-srv
              port:
                number: 7000